name: 積金羅盤：Refresh MPFA catalog

on:
  schedule:
    - cron: "0 8 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mpf-compass-refresh
  cancel-in-progress: false

defaults:
  run:
    working-directory: mpf-compass

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull MPFA fund platform
        run: node scripts/refresh-mpfa.mjs
      - name: Commit if the snapshot moved
        run: |
          git config user.name "mpf-compass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/funds.json src/lib/i18n.ts src/lib/mpf/returns.ts
          if git diff --cached --quiet; then echo "No catalog change."; exit 0; fi
          git commit -m "mpf-compass: refresh MPFA constituent-fund snapshot"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
