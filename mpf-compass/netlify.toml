# 積金羅盤 — Netlify
# Netlify sets NETLIFY=true during CI, so the Nitro preset switches to
# `netlify` (SSR + Functions for the live Yahoo index endpoints).

[build]
# 只有呢個 folder 有改動先重新部署（同一 repo 有多個工具）
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
